<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOOD Lounge - Salida Externa TV</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #display-mode-root {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* CAPA DE VIDEO */
    #extVideoLayer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 5;
    }
    #extPlayer, #extVideoLayer iframe {
      width: 100% !important;
      height: 100% !important;
      pointer-events: none !important;
      border: 0;
    }

    /* CAPA AMBIENT (SALIDA SIN VIDEO) */
    #extAmbientLayer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    #extCustomBgImageLayer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 1;
    }

    /* LOGO Y CONTENEDOR FLOTANTE */
    #screenLogoBox {
      position: absolute;
      z-index: 9000;
      pointer-events: none;
      transition: opacity 0.6s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #screenLogoBox.ambient-floating {
      width: 32vw;
      min-width: 260px;
    }
    #screenLogoBox.video-watermark {
      width: 24%;
      display: block;
    }
    #screenLogoImg {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* ECUALIZADOR GRÁFICO ULTRA LIGERO CON scaleY (0 REFLOWS DE PANTALLA) */
    .eq-bar-wrapper {
      display: flex;
      align-items: flex-end;
      width: 100%;
      height: 46px;
      gap: 5px;
      pointer-events: none;
    }
    .eq-bar-wrapper-top {
      align-items: flex-end;
      margin-bottom: 6px;
    }
    .eq-bar-wrapper-bottom {
      align-items: flex-start;
      margin-top: 6px;
    }
    .ambient-bar {
      flex: 1;
      height: 100% !important;
      transform: scaleY(0.08);
      border-radius: 3px;
      transition: transform 0.08s linear;
      will-change: transform;
      background-color: #ef4444;
    }
    #ambientTopEQ .ambient-bar {
      transform-origin: bottom center !important;
    }
    #ambientBottomEQ .ambient-bar {
      transform-origin: top center !important;
    }

    /* REBOTE / FLOTACIÓN SUAVE NATIVA POR GPU (@keyframes) */
    @keyframes moodGentleFloat {
      0% { transform: translate3d(0, 0, 0); }
      25% { transform: translate3d(24px, -16px, 0); }
      50% { transform: translate3d(-18px, 20px, 0); }
      75% { transform: translate3d(20px, 14px, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }
    .logo-ambient-float {
      animation: moodGentleFloat 22s ease-in-out infinite alternate;
      will-change: transform;
    }

    /* ESCUDO DE EVENTOS */
    #extMouseShield {
      position: fixed;
      inset: 0;
      z-index: 42;
      background: transparent;
      cursor: default;
    }

    /* BANNER SONANDO AHORA / SIGUIENTE */
    #extNowPlayingBanner {
      position: fixed;
      left: 32px;
      bottom: 24px;
      z-index: 50;
      background: rgba(0, 0, 0, 0.92);
      border-left: 4px solid #00f0ff;
      border-radius: 0 12px 12px 0;
      padding: 12px 20px;
      max-width: 580px;
      pointer-events: none;
      transition: opacity 0.35s ease;
      opacity: 0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8);
    }
    #extNowPlayingBanner.visible {
      opacity: 1;
    }
    .banner-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .banner-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .banner-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: #00f0ff;
    }
    .banner-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }
    .banner-next {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .banner-next-tag {
      color: #ec4899;
      font-weight: 700;
    }

    /* MENSAJE PROMOCIONAL TV (MARQUESINA) */
    #extTickerContainer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 25vh;
      display: flex;
      align-items: center;
      background: #0b0709;
      border-top: 3px solid rgba(245, 158, 11, 0.7);
      z-index: 45;
      overflow: hidden;
      pointer-events: none;
    }
    #extTickerContainer.hidden {
      display: none !important;
    }
    @keyframes moodMarquee {
      0% { transform: translate3d(100vw, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }
    .mood-ticker-text {
      display: inline-block;
      white-space: nowrap;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      color: #fde047;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 11vh;
      line-height: 1.05;
      animation: moodMarquee 18s linear infinite;
      will-change: transform;
    }

    /* BOTÓN PANTALLA COMPLETA */
    #fsBtn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.88);
      color: #fca5a5;
      border: 1.5px solid rgba(239, 68, 68, 0.85);
      border-radius: 8px;
      padding: 8px 14px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, background 0.2s, color 0.2s;
    }
    #fsBtn.fs-visible {
      opacity: 0.95;
      pointer-events: auto;
    }
    #fsBtn:hover {
      opacity: 1;
      background: #dc2626;
      color: #ffffff;
    }

    .hidden {
      display: none !important;
    }
    .opacity-0 {
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>

  <div id="display-mode-root">
    
    <!-- CAPA DE VIDEO (Solo activo en SALIDA VIDEO) -->
    <div id="extVideoLayer">
      <div id="extPlayer"></div>
    </div>

    <!-- CAPA AMBIENT (Solo activo en SALIDA SIN VIDEO) -->
    <div id="extAmbientLayer">
      <div id="extCustomBgImageLayer"></div>
    </div>

    <!-- LOGO WATERMARK + ECUALIZADOR SUPERIOR E INFERIOR -->
    <div id="screenLogoBox" class="ambient-floating">
      <!-- Ecualizador Superior -->
      <div id="ambientTopEQ" class="eq-bar-wrapper eq-bar-wrapper-top">
        <div id="ambTopBar-1" class="ambient-bar"></div>
        <div id="ambTopBar-2" class="ambient-bar"></div>
        <div id="ambTopBar-3" class="ambient-bar"></div>
        <div id="ambTopBar-4" class="ambient-bar"></div>
        <div id="ambTopBar-5" class="ambient-bar"></div>
        <div id="ambTopBar-6" class="ambient-bar"></div>
        <div id="ambTopBar-7" class="ambient-bar"></div>
        <div id="ambTopBar-8" class="ambient-bar"></div>
        <div id="ambTopBar-9" class="ambient-bar"></div>
        <div id="ambTopBar-10" class="ambient-bar"></div>
        <div id="ambTopBar-11" class="ambient-bar"></div>
        <div id="ambTopBar-12" class="ambient-bar"></div>
      </div>
      
      <img id="screenLogoImg" alt="MOOD Lounge Logo">
      
      <!-- Ecualizador Inferior -->
      <div id="ambientBottomEQ" class="eq-bar-wrapper eq-bar-wrapper-bottom">
        <div id="ambBtmBar-1" class="ambient-bar"></div>
        <div id="ambBtmBar-2" class="ambient-bar"></div>
        <div id="ambBtmBar-3" class="ambient-bar"></div>
        <div id="ambBtmBar-4" class="ambient-bar"></div>
        <div id="ambBtmBar-5" class="ambient-bar"></div>
        <div id="ambBtmBar-6" class="ambient-bar"></div>
        <div id="ambBtmBar-7" class="ambient-bar"></div>
        <div id="ambBtmBar-8" class="ambient-bar"></div>
        <div id="ambBtmBar-9" class="ambient-bar"></div>
        <div id="ambBtmBar-10" class="ambient-bar"></div>
        <div id="ambBtmBar-11" class="ambient-bar"></div>
        <div id="ambBtmBar-12" class="ambient-bar"></div>
      </div>
    </div>

    <!-- ESCUDO DE MOUSE PARA ACTIVAR CONTROLES Y PANTALLA COMPLETA -->
    <div id="extMouseShield"></div>

    <!-- BANNER NOW PLAYING TV -->
    <div id="extNowPlayingBanner">
      <div class="banner-badge">
        <span class="banner-dot"></span>
        <span class="banner-label">SONANDO AHORA</span>
      </div>
      <div id="extBannerCurrent" class="banner-title">MOOD Lounge</div>
      <div class="banner-next">
        <span class="banner-next-tag">SIGUIENTE:</span> <span id="extBannerNext">Cola Automix</span>
      </div>
    </div>

    <!-- MARQUESINA DE TEXTO PROMOCIONAL -->
    <div id="extTickerContainer" class="hidden">
      <div id="extTickerContent" class="mood-ticker-text"></div>
    </div>

    <!-- BOTÓN DE PANTALLA COMPLETA -->
    <button id="fsBtn" onclick="toggleFullScreen()">
      <i class="fa-solid fa-expand"></i>
      <span>PANTALLA COMPLETA</span>
    </button>
  </div>

  <script>
    // =========================================================================
    // SALIDA EXTERNA ULTRALIGERA PARA TV (Cero Lag, Cero Tailwind, Proceso Aislado)
    // =========================================================================
    const RED_M_FAVICON = 'data:image/svg+xml;utf8,' + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <rect width="60" height="60" x="2" y="2" rx="14" fill="#08090d" stroke="#ef4444" stroke-width="4"/>
        <text x="32" y="48" text-anchor="middle" font-family="Orbitron, Arial Black, Impact, sans-serif" font-size="44" font-weight="900" fill="#ef4444">M</text>
      </svg>
    `);
    const faviconLink = document.createElement('link');
    faviconLink.rel = 'icon';
    faviconLink.type = 'image/svg+xml';
    faviconLink.href = RED_M_FAVICON;
    document.head.appendChild(faviconLink);

    const SVG_DEFAULT_LOGO = 'data:image/svg+xml;utf8,' + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110">
        <defs>
          <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ef4444"/>
            <stop offset="100%" stop-color="#00f0ff"/>
          </linearGradient>
        </defs>
        <rect width="310" height="100" x="5" y="5" rx="16" fill="#090a0f" fill-opacity="0.85" stroke="url(#g)" stroke-width="3"/>
        <circle cx="52" cy="55" r="26" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="10 6"/>
        <circle cx="52" cy="55" r="8" fill="#00f0ff"/>
        <text x="95" y="52" font-family="Orbitron, Arial, sans-serif" font-size="26" font-weight="900" fill="#ffffff" letter-spacing="2">MOOD</text>
        <text x="95" y="78" font-family="monospace" font-size="16" font-weight="700" fill="#00f0ff" letter-spacing="5">LOUNGE PRO</text>
      </svg>
    `);

    const urlParams = new URLSearchParams(window.location.search);
    let displayVisualMode = urlParams.get('type') || 'video';
    let extLoadedVideoId = urlParams.get('vid') || 'kJQP7kiw5Fk';
    let extStartSeconds = parseInt(urlParams.get('t')) || 0;

    let extPlayer = null;
    let ytScriptLoaded = false;
    let consoleIsPlaying = false;

    let logoData = {
      src: localStorage.getItem('moodj_logo_src') || SVG_DEFAULT_LOGO,
      size: parseInt(localStorage.getItem('moodj_logo_size')) || 25,
      opacity: parseFloat(localStorage.getItem('moodj_logo_opacity')) || 0.9,
      topPercent: parseFloat(localStorage.getItem('moodj_logo_top')) || 6,
      leftPercent: parseFloat(localStorage.getItem('moodj_logo_left')) || 70
    };

    let bgConfig = Object.assign({
      color: '#000000',
      imageData: '',
      imageOpacity: 60
    }, JSON.parse(localStorage.getItem('moodj_pro_bg_config') || '{}'));

    let proModules = Object.assign({
      tvBanner: true,
      tvTicker: false
    }, JSON.parse(localStorage.getItem('moodj_pro_modules_state') || '{}'));

    let tickerMessage = localStorage.getItem('moodj_pro_ticker_msg') || 'BIENVENIDOS A MOOD LOUNGE — DISFRUTA LA MEJOR MÚSICA Y MIXES EN VIVO';
    let tickerSizePercent = Math.max(10, Math.min(100, parseInt(localStorage.getItem('moodj_pro_ticker_size')) || 25));

    const COLOR_THEMES = [
      ['#ef4444', '#f97316', '#f59e0b', '#84cc16', '#10b981', '#06b6d4', '#0284c7', '#6366f1', '#8b5cf6', '#d946ef', '#ec4899', '#f43f5e'],
      ['#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff'],
      ['#e0f2fe', '#bae6fd', '#7dd3fc', '#38bdf8', '#0ea5e9', '#0284c7', '#0369a1', '#00f0ff', '#38bdf8', '#7dd3fc', '#bae6fd', '#e0f2fe'],
      ['#fdf4ff', '#fae8ff', '#f5d0fe', '#f0abfc', '#e879f9', '#d946ef', '#c026d3', '#a21caf', '#8b5cf6', '#c084fc', '#e879f9', '#fae8ff'],
      ['#fef2f2', '#fee2e2', '#fca5a5', '#f87171', '#ef4444', '#dc2626', '#f59e0b', '#fbbf24', '#fde047', '#f59e0b', '#dc2626', '#ef4444']
    ];
    let currentThemeIndex = 0;

    const VIDEO_LOGO_SPOTS = ['top-left', 'top-center', 'top-right', 'bottom-left', 'bottom-center', 'bottom-right'];
    const AMBIENT_LOGO_SPOTS = [
      { top: 8, left: 6 },
      { top: 8, left: 35 },
      { top: 8, left: 64 },
      { top: 36, left: 6 },
      { top: 36, left: 35 },
      { top: 36, left: 64 },
      { top: 64, left: 6 },
      { top: 64, left: 35 },
      { top: 64, left: 64 }
    ];
    let currentVideoLogoSpot = 'top-right';
    let currentAmbientSpotIdx = 4;
    let logoCycleInterval = null;

    // COMUNICACIÓN BROADCASTCHANNEL
    const displayBroadcast = ('BroadcastChannel' in window) ? new BroadcastChannel('moodj_video_screen') : null;

    function sendToConsole(action, data = {}) {
      if (displayBroadcast) {
        displayBroadcast.postMessage({ action, ...data });
      }
    }

    // AVISAR A LA CONSOLA AL ABRIR Y AL CERRAR
    window.addEventListener('beforeunload', () => {
      sendToConsole('displayClosed', {});
    });
    window.addEventListener('pagehide', () => {
      sendToConsole('displayClosed', {});
    });

    // LATIDO PERIÓDICO (1200ms) PARA QUE LA CONSOLA SEPA QUE ESTA PANTALLA ESTÁ VIVA
    setInterval(() => {
      sendToConsole('displayHeartbeat', { mode: displayVisualMode });
    }, 1200);

    // =========================================================================
    // CREACIÓN / DESTRUCCIÓN CONDICIONAL DEL REPRODUCTOR DE YOUTUBE
    // =========================================================================
    function ensureVideoPlayer() {
      if (displayVisualMode !== 'video') return;
      if (extPlayer && typeof extPlayer.loadVideoById === 'function') return;

      const videoLayer = document.getElementById('extVideoLayer');
      if (!document.getElementById('extPlayer')) {
        const div = document.createElement('div');
        div.id = 'extPlayer';
        div.style.width = '100%';
        div.style.height = '100%';
        videoLayer.appendChild(div);
      }

      const createYTInstance = () => {
        extPlayer = new YT.Player('extPlayer', {
          height: '100%',
          width: '100%',
          videoId: extLoadedVideoId,
          playerVars: {
            autoplay: 1,
            controls: 0,
            modestbranding: 1,
            rel: 0,
            playsinline: 1,
            enablejsapi: 1,
            start: Math.max(0, Math.floor(extStartSeconds || 0)),
            origin: window.location.origin
          },
          events: {
            'onReady': () => {
              try {
                if (extPlayer.setPlaybackQuality) extPlayer.setPlaybackQuality('medium');
              } catch (e) {}
              extPlayer.mute();
              if (consoleIsPlaying) {
                extPlayer.playVideo();
              }
            }
          }
        });
      };

      if (window.YT && window.YT.Player) {
        createYTInstance();
      } else if (!ytScriptLoaded) {
        ytScriptLoaded = true;
        window.onYouTubeIframeAPIReady = () => {
          createYTInstance();
        };
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);
      }
    }

    function destroyVideoPlayer() {
      if (extPlayer) {
        try {
          if (typeof extPlayer.stopVideo === 'function') extPlayer.stopVideo();
          if (typeof extPlayer.destroy === 'function') extPlayer.destroy();
        } catch (e) {}
        extPlayer = null;
      }
      const p = document.getElementById('extPlayer');
      if (p) p.innerHTML = '';
    }

    // =========================================================================
    // DISPOSICIÓN VISUAL (VIDEO VS AMBIENT SIN VIDEO)
    // =========================================================================
    function applyLayout(mode) {
      displayVisualMode = mode;
      const videoLayer = document.getElementById('extVideoLayer');
      const ambientLayer = document.getElementById('extAmbientLayer');
      const logoBox = document.getElementById('screenLogoBox');
      const ambientTopEQ = document.getElementById('ambientTopEQ');
      const ambientBottomEQ = document.getElementById('ambientBottomEQ');

      if (mode === 'ambient') {
        // SALIDA SIN VIDEO: destruir reproductor, mostrar ecualizador y capas visuales
        destroyVideoPlayer();
        videoLayer.classList.add('opacity-0');
        ambientLayer.classList.remove('hidden');
        ambientTopEQ.classList.remove('hidden');
        ambientBottomEQ.classList.remove('hidden');

        logoBox.className = 'ambient-floating';
        logoBox.style.width = '32vw';
        logoBox.classList.add('logo-ambient-float');
        placeLogoAtSpot('ambient', currentAmbientSpotIdx, false);
      } else {
        // SALIDA VIDEO: ocultar ambient layer, activar video y watermark en esquina
        videoLayer.classList.remove('opacity-0');
        ambientLayer.classList.add('hidden');
        ambientTopEQ.classList.add('hidden');
        ambientBottomEQ.classList.add('hidden');

        logoBox.className = 'video-watermark';
        logoBox.style.width = `${logoData.size}%`;
        logoBox.classList.remove('logo-ambient-float');
        placeLogoAtSpot('video', currentVideoLogoSpot, false);

        ensureVideoPlayer();
      }

      startLogoCycle();
      applyBackground();
    }

    // =========================================================================
    // ECUALIZADOR GRÁFICO (scaleY + transform-origin, 0 REFLOWS DE PANTALLA)
    // =========================================================================
    let eqInterval = null;
    function startEqualizer() {
      if (eqInterval) clearInterval(eqInterval);
      let beatAngle = 0;
      let lastTheme = -1;

      eqInterval = setInterval(() => {
        if (displayVisualMode !== 'ambient') return;

        const isPlaying = consoleIsPlaying;
        const currentColors = COLOR_THEMES[currentThemeIndex];
        const themeChanged = (currentThemeIndex !== lastTheme);
        if (themeChanged) lastTheme = currentThemeIndex;

        let kickPeak = 0;
        if (isPlaying) {
          beatAngle += 0.24;
          kickPeak = Math.pow(Math.sin(beatAngle), 4);
        } else {
          beatAngle = 0;
          kickPeak = 0;
        }

        for (let i = 1; i <= 12; i++) {
          const topBar = document.getElementById(`ambTopBar-${i}`);
          const btmBar = document.getElementById(`ambBtmBar-${i}`);
          const isBassBar = (i <= 4 || i >= 9);
          const energy = isBassBar ? (kickPeak * 68 + Math.random() * 22) : (Math.random() * 45 + kickPeak * 25);
          const scale = isPlaying ? Math.min(0.95, Math.max(0.10, energy / 100)) : 0.08;

          if (topBar) {
            if (themeChanged) topBar.style.backgroundColor = currentColors[(i - 1) % currentColors.length];
            topBar.style.transform = `scaleY(${scale.toFixed(2)})`;
          }
          if (btmBar) {
            if (themeChanged) btmBar.style.backgroundColor = currentColors[(i - 1) % currentColors.length];
            btmBar.style.transform = `scaleY(${scale.toFixed(2)})`;
          }
        }
      }, 85);
    }

    // ROTACIÓN DE PALETAS CADA 7 SEGUNDOS
    setInterval(() => {
      currentThemeIndex = (currentThemeIndex + 1) % COLOR_THEMES.length;
    }, 7000);

    // =========================================================================
    // REBOTE Y CICLO ANTI-QUEMADO DE LOGO (FADE NATIVO CSS, CERO INTERVALOS DE 25MS)
    // =========================================================================
    function computeSpotCoords(spot) {
      const w = parseFloat(logoData.size) || 25;
      const estHeightPct = Math.max(14, w * 0.52);
      let top = spot.startsWith('top-') ? 5 : Math.max(6, 93 - estHeightPct);
      let left = 4;
      if (spot.endsWith('-center')) left = Math.max(2, (100 - w) / 2);
      else if (spot.endsWith('-right')) left = Math.max(4, 100 - w - 4);
      return { top, left };
    }

    function placeLogoAtSpot(mode, spotOrIdx, useFade = true) {
      const logoBox = document.getElementById('screenLogoBox');
      if (!logoBox) return;
      const targetOpacity = logoData.opacity || 0.9;

      const setCoords = () => {
        if (mode === 'ambient') {
          const pt = AMBIENT_LOGO_SPOTS[spotOrIdx] || AMBIENT_LOGO_SPOTS[4];
          logoBox.style.top = `${pt.top}%`;
          logoBox.style.left = `${pt.left}%`;
        } else {
          currentVideoLogoSpot = spotOrIdx;
          const coords = computeSpotCoords(spotOrIdx);
          logoBox.style.top = `${coords.top}%`;
          logoBox.style.left = `${coords.left}%`;
        }
      };

      if (!useFade) {
        setCoords();
        logoBox.style.opacity = targetOpacity;
        return;
      }

      logoBox.style.opacity = '0';
      setTimeout(() => {
        setCoords();
        requestAnimationFrame(() => {
          logoBox.style.opacity = targetOpacity;
        });
      }, 650);
    }

    function startLogoCycle() {
      if (logoCycleInterval) clearInterval(logoCycleInterval);
      logoCycleInterval = setInterval(() => {
        if (!logoData || !logoData.src) return;
        if (displayVisualMode === 'ambient') {
          const c = AMBIENT_LOGO_SPOTS.map((_, i) => i).filter(i => i !== currentAmbientSpotIdx);
          currentAmbientSpotIdx = c[Math.floor(Math.random() * c.length)] || 0;
          placeLogoAtSpot('ambient', currentAmbientSpotIdx, true);
        } else {
          const avail = VIDEO_LOGO_SPOTS.filter(s => s !== currentVideoLogoSpot);
          const nextSpot = avail[Math.floor(Math.random() * avail.length)] || VIDEO_LOGO_SPOTS[0];
          placeLogoAtSpot('video', nextSpot, true);
        }
      }, 20000);
    }

    // =========================================================================
    // APLICACIÓN DE ESTILOS DE LOGO, FONDO Y MARQUESINA
    // =========================================================================
    function applyLogo() {
      const img = document.getElementById('screenLogoImg');
      if (img) {
        img.src = logoData.src || SVG_DEFAULT_LOGO;
      }
      const logoBox = document.getElementById('screenLogoBox');
      if (logoBox) {
        logoBox.style.opacity = logoData.opacity || 0.9;
        if (displayVisualMode === 'video') {
          logoBox.style.width = `${logoData.size}%`;
        }
      }
    }

    function applyBackground() {
      const displayRoot = document.getElementById('display-mode-root');
      const ambientLayer = document.getElementById('extAmbientLayer');
      const videoLayer = document.getElementById('extVideoLayer');
      const bgImgEl = document.getElementById('extCustomBgImageLayer');

      const col = bgConfig.color || '#000000';
      displayRoot.style.backgroundColor = col;
      videoLayer.style.backgroundColor = col;
      ambientLayer.style.backgroundColor = col;

      if (bgImgEl) {
        const hasImg = !!(bgConfig.imageData && bgConfig.imageData.length > 10);
        bgImgEl.style.backgroundImage = hasImg ? `url("${bgConfig.imageData}")` : 'none';
        bgImgEl.style.opacity = hasImg ? String(Math.max(10, Math.min(100, parseInt(bgConfig.imageOpacity) || 60)) / 100) : '0';
      }
    }

    function applyTicker() {
      const container = document.getElementById('extTickerContainer');
      const content = document.getElementById('extTickerContent');
      if (!container || !content) return;

      if (!proModules.tvTicker) {
        container.classList.add('hidden');
        return;
      }
      container.classList.remove('hidden');
      content.textContent = tickerMessage;

      const pct = tickerSizePercent;
      const vh = Math.max(10, Math.min(50, Math.round(pct * 0.45)));
      const fontVh = Math.max(5, Math.min(30, Math.round(pct * 0.26)));
      container.style.height = `${vh}vh`;
      content.style.fontSize = `${fontVh}vh`;
    }

    let bannerTimer = null;
    function triggerBanner(nowPlaying, upNext) {
      const banner = document.getElementById('extNowPlayingBanner');
      if (!banner) return;
      if (!proModules.tvBanner) {
        banner.classList.remove('visible');
        return;
      }
      document.getElementById('extBannerCurrent').textContent = nowPlaying || 'MOOD Lounge';
      document.getElementById('extBannerNext').textContent = upNext || 'Cola Automix';
      banner.classList.add('visible');

      if (bannerTimer) clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => {
        banner.classList.remove('visible');
      }, 9000);
    }

    // =========================================================================
    // CONTROL DE RATÓN Y PANTALLA COMPLETA
    // =========================================================================
    let fsMouseTimer = null;
    function wakeFsButton() {
      const btn = document.getElementById('fsBtn');
      if (btn) btn.classList.add('fs-visible');
      if (fsMouseTimer) clearTimeout(fsMouseTimer);
      fsMouseTimer = setTimeout(() => {
        if (btn) btn.classList.remove('fs-visible');
      }, 2500);
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    const shield = document.getElementById('extMouseShield');
    if (shield) {
      shield.addEventListener('mousemove', wakeFsButton, { passive: true });
      shield.addEventListener('mousedown', wakeFsButton, { passive: true });
      shield.addEventListener('dblclick', toggleFullScreen);
    }

    // =========================================================================
    // RECEPTOR DE MENSAJES BROADCASTCHANNEL
    // =========================================================================
    if (displayBroadcast) {
      displayBroadcast.onmessage = (e) => {
        if (!e.data) return;
        const d = e.data;

        if (d.action === 'proConfig') {
          if (d.modules) proModules = d.modules;
          if (d.bgConfig) {
            bgConfig = d.bgConfig;
            applyBackground();
          }
          if (d.tickerMessage) tickerMessage = d.tickerMessage;
          if (typeof d.tickerSizePercent === 'number') tickerSizePercent = d.tickerSizePercent;
          if (typeof d.isPlaying === 'boolean') consoleIsPlaying = d.isPlaying;

          applyTicker();
          if (d.showBannerNow) {
            triggerBanner(d.nowPlaying, d.upNext);
          }
          return;
        }

        if (d.action === 'updateLogo') {
          logoData = d.logo || logoData;
          applyLogo();
          return;
        }

        if (d.action === 'switchMode') {
          if (d.videoId) extLoadedVideoId = d.videoId;
          if (typeof d.seconds === 'number') extStartSeconds = d.seconds;
          applyLayout(d.mode);
          return;
        }

        if (d.action === 'setLogoSpot' && d.spot) {
          if (displayVisualMode !== 'ambient') {
            placeLogoAtSpot('video', d.spot, true);
          }
          return;
        }

        if (d.action === 'changeVideo') {
          consoleIsPlaying = true;
          extLoadedVideoId = d.videoId || extLoadedVideoId;
          if (displayVisualMode === 'video') {
            ensureVideoPlayer();
            if (extPlayer && extPlayer.loadVideoById) {
              extPlayer.loadVideoById({ videoId: d.videoId, suggestedQuality: 'medium' });
            }
          }
          return;
        }

        if (d.action === 'play') {
          consoleIsPlaying = true;
          if (displayVisualMode === 'video') {
            ensureVideoPlayer();
            if (extPlayer) {
              if (d.videoId && d.videoId !== extLoadedVideoId && extPlayer.loadVideoById) {
                extLoadedVideoId = d.videoId;
                extPlayer.loadVideoById({ videoId: d.videoId, startSeconds: d.seconds || 0, suggestedQuality: 'medium' });
              } else if (extPlayer.playVideo) {
                extPlayer.playVideo();
              }
            }
          }
          return;
        }

        if (d.action === 'pause') {
          consoleIsPlaying = false;
          if (extPlayer && extPlayer.pauseVideo) {
            extPlayer.pauseVideo();
          }
          return;
        }

        if (d.action === 'seek') {
          if (displayVisualMode === 'video' && extPlayer && extPlayer.seekTo) {
            extPlayer.seekTo(d.seconds, true);
          }
          return;
        }

        if (d.action === 'timeSync' && extPlayer && extPlayer.getCurrentTime) {
          const extTime = extPlayer.getCurrentTime();
          if (typeof d.seconds === 'number' && Math.abs(extTime - d.seconds) > 0.6) {
            extPlayer.seekTo(d.seconds, true);
          }
          if (d.state === 1 && extPlayer.getPlayerState && extPlayer.getPlayerState() !== 1) {
            extPlayer.playVideo();
          } else if (d.state === 2 && extPlayer.getPlayerState && extPlayer.getPlayerState() !== 2) {
            extPlayer.pauseVideo();
          }
        }
      };
    }

    // =========================================================================
    // INICIALIZACIÓN ULTRALIGERA AL ARRANCAR
    // =========================================================================
    applyLogo();
    applyBackground();
    applyTicker();
    startEqualizer();
    applyLayout(displayVisualMode);

    // SOLICITAR ESTADO COMPLETO A LA CONSOLA AL ABRIR
    sendToConsole('requestSync', {});
    wakeFsButton();
  </script>
</body>
</html>
